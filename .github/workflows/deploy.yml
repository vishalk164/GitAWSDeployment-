name: HTML Application CI/CD

on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application
        run: |
          echo "Building application..."
          test -f index.html
          echo "Build completed successfully!"

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Testing..............."
          test -f index.html
          grep -qi "<html" index.html
          grep -qi "</html>" index.html
          echo "HTML file test passed!"
          echo "Testing completed successfully!"

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Deployment
        run: |
          echo "Preparing application for deployment..."
          test -f index.html
          echo "Deployment preparation completed!"

  deploy-to-ec2:
    name: Deploy to EC2
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Test EC2 Connection
        run: |
          echo "Testing EC2 connection..."
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "echo 'EC2 connection successful!'"

      - name: Deploy Website
        run: |
          echo "Deploying website to EC2..."

          scp \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            index.html \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/index.html"

          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "sudo cp /tmp/index.html /var/www/html/index.html && sudo systemctl reload nginx"

          echo "Website deployed successfully!"
